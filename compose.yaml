  ANSWER_JOB_WORKER_CONCURRENCY: ${ANSWER_JOB_WORKER_CONCURRENCY:-10}
  ANSWER_JOB_POLL_INTERVAL: ${ANSWER_JOB_POLL_INTERVAL:-1s}
  ANSWER_JOB_PROCESSING_TIMEOUT: ${ANSWER_JOB_PROCESSING_TIMEOUT:-90s}
  ANSWER_JOB_MAX_QUEUED_PER_USER: ${ANSWER_JOB_MAX_QUEUED_PER_USER:-5}
  ANSWER_JOB_MAX_QUEUED_GLOBAL: ${ANSWER_JOB_MAX_QUEUED_GLOBAL:-500}
  ANSWER_JOB_OWNER_IN_FLIGHT_LIMIT: ${ANSWER_JOB_OWNER_IN_FLIGHT_LIMIT:-1}
  ANSWER_JOB_OWNER_BORROWED_LIMIT: ${ANSWER_JOB_OWNER_BORROWED_LIMIT:-2}
  ANSWER_JOB_STARVATION_THRESHOLD: ${ANSWER_JOB_STARVATION_THRESHOLD:-30s}
  ANSWER_JOB_MAX_ATTEMPTS: ${ANSWER_JOB_MAX_ATTEMPTS:-3}
  ANSWER_JOB_RETRY_BASE_DELAY: ${ANSWER_JOB_RETRY_BASE_DELAY:-2s}
  ANSWER_JOB_RETRY_MAX_DELAY: ${ANSWER_JOB_RETRY_MAX_DELAY:-30s}
  ANSWER_JOB_RETENTION: ${ANSWER_JOB_RETENTION:-168h}
  ANSWER_JOB_CLEANUP_INTERVAL: ${ANSWER_JOB_CLEANUP_INTERVAL:-1h}
  ANSWER_JOB_CLEANUP_BATCH_SIZE: ${ANSWER_JOB_CLEANUP_BATCH_SIZE:-500}

x-cache-environment: &cache-environment
  RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-false}
  CACHE_NAMESPACE: ${CACHE_NAMESPACE:-rag}
  REDIS_ADDRESS: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  CACHE_HMAC_SECRET: ${CACHE_HMAC_SECRET:-}
  CACHE_OPERATION_TIMEOUT: ${CACHE_OPERATION_TIMEOUT:-250ms}
  QUERY_VECTOR_CACHE_TTL: ${QUERY_VECTOR_CACHE_TTL:-12h}
  QUERY_VECTOR_CACHE_LOCK_TTL: ${QUERY_VECTOR_CACHE_LOCK_TTL:-30s}
  QUERY_VECTOR_CACHE_WAIT_TIMEOUT: ${QUERY_VECTOR_CACHE_WAIT_TIMEOUT:-2s}
  ANSWER_RESULT_CACHE_TTL: ${ANSWER_RESULT_CACHE_TTL:-15m}
  ANSWER_RESULT_CACHE_LOCK_TTL: ${ANSWER_RESULT_CACHE_LOCK_TTL:-90s}
  ANSWER_RESULT_CACHE_WAIT_TIMEOUT: ${ANSWER_RESULT_CACHE_WAIT_TIMEOUT:-10s}

x-capacity-coordination-environment: &capacity-coordination-environment
  # 容量协调与可淘汰缓存分离。开启后 Redis 故障会拒绝新的远程调用，
  # 不会退化为每个进程各自放行完整并发上限。
  CAPACITY_COORDINATION_ENABLED: ${CAPACITY_COORDINATION_ENABLED:-true}
  CAPACITY_NAMESPACE: ${CAPACITY_NAMESPACE:-rag-capacity}
  CAPACITY_REDIS_ADDRESS: redis-coordination:6379
  CAPACITY_REDIS_PASSWORD: ${CAPACITY_REDIS_PASSWORD:-}
  CAPACITY_REDIS_DATABASE: ${CAPACITY_REDIS_DATABASE:-0}
  CAPACITY_OPERATION_TIMEOUT: ${CAPACITY_OPERATION_TIMEOUT:-250ms}
  CAPACITY_LEASE_TTL: ${CAPACITY_LEASE_TTL:-3m}
  CAPACITY_RETRY_INTERVAL: ${CAPACITY_RETRY_INTERVAL:-25ms}

x-auth-environment: &auth-environment
  VERIFICATION_HMAC_SECRET: ${VERIFICATION_HMAC_SECRET:-}
  VERIFICATION_SENDER: ${VERIFICATION_SENDER:-fake}
  VERIFICATION_SMTP_HOST: ${VERIFICATION_SMTP_COMPOSE_HOST:-mailpit}
  VERIFICATION_SMTP_PORT: 1025
  VERIFICATION_SMTP_FROM_ADDRESS: ${VERIFICATION_SMTP_FROM_ADDRESS:-no-reply@rag.local}
  VERIFICATION_SMTP_FROM_NAME: ${VERIFICATION_SMTP_FROM_NAME:-RAG Reasoning Platform}
  VERIFICATION_SMTP_TIMEOUT: ${VERIFICATION_SMTP_TIMEOUT:-5s}
  VERIFICATION_RATE_LIMIT_WINDOW: ${VERIFICATION_RATE_LIMIT_WINDOW:-1m}
  VERIFICATION_PER_CLIENT_LIMIT: ${VERIFICATION_PER_CLIENT_LIMIT:-5}
  VERIFICATION_GLOBAL_LIMIT: ${VERIFICATION_GLOBAL_LIMIT:-100}
  AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
  AUTH_PER_CLIENT_LIMIT: ${AUTH_PER_CLIENT_LIMIT:-10}
  AUTH_GLOBAL_LIMIT: ${AUTH_GLOBAL_LIMIT:-200}

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "test -s /tmp/rag-role-ready"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

services:
  backend:
    <<: *backend-runtime
    depends_on: *remote-backend-dependencies
    container_name: rag_reasoning_backend
    environment:
      <<: [*backend-common-environment, *storage-environment, *document-environment, *embedding-environment, *generation-environment, *answer-jobs-environment, *cache-environment, *capacity-coordination-environment, *auth-environment]
      APP_ROLE: api
      APP_PORT: 8080
      DB_MAX_CONNECTIONS: ${API_DB_MAX_CONNECTIONS:-5}
      # API 可以提交向量任务，但绝不在 HTTP 进程内领取任务。
      EMBEDDING_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    volumes:
      - ${STORAGE_HOST_PATH:-./storage}:/app/storage
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    cpus: ${BACKEND_CPUS:-2.0}

  document-worker:
    <<: *backend-runtime
    container_name: rag_reasoning_document_worker
    environment:
      <<: [*backend-common-environment, *storage-environment, *document-environment, *python-environment]
      APP_ROLE: document-worker
      APP_READY_FILE: /tmp/rag-role-ready
      DB_MAX_CONNECTIONS: ${DOCUMENT_WORKER_DB_MAX_CONNECTIONS:-3}
    healthcheck: *worker-healthcheck
    volumes:
      # 必须与 API 挂载同一个宿主机目录，否则 Worker 看不到上传文件。
      - ${STORAGE_HOST_PATH:-./storage}:/app/storage
    mem_limit: ${DOCUMENT_WORKER_MEM_LIMIT:-1024m}
    cpus: ${DOCUMENT_WORKER_CPUS:-2.0}

  embedding-worker:
    <<: *backend-runtime
    depends_on: *remote-backend-dependencies
    profiles: ["embedding"]
    container_name: rag_reasoning_embedding_worker
    environment:
      <<: [*backend-common-environment, *embedding-environment, *capacity-coordination-environment]
      APP_ROLE: embedding-worker
      APP_READY_FILE: /tmp/rag-role-ready
      DB_MAX_CONNECTIONS: ${EMBEDDING_WORKER_DB_MAX_CONNECTIONS:-3}
      EMBEDDING_WORKER_ENABLED: "true"
    healthcheck: *worker-healthcheck
    mem_limit: ${EMBEDDING_WORKER_MEM_LIMIT:-512m}
    cpus: ${EMBEDDING_WORKER_CPUS:-1.0}

  answer-worker:
    <<: *backend-runtime
    depends_on: *remote-backend-dependencies
    profiles: ["answer"]
    container_name: rag_reasoning_answer_worker
    environment:
      <<: [*backend-common-environment, *embedding-environment, *generation-environment, *answer-jobs-environment, *cache-environment, *capacity-coordination-environment]
      APP_ROLE: answer-worker
      APP_READY_FILE: /tmp/rag-role-ready
      DB_MAX_CONNECTIONS: ${ANSWER_WORKER_DB_MAX_CONNECTIONS:-5}
      EMBEDDING_WORKER_ENABLED: "false"
      ANSWER_ENABLED: "true"
      ANSWER_JOBS_ENABLED: "true"
    healthcheck: *worker-healthcheck
    mem_limit: ${ANSWER_WORKER_MEM_LIMIT:-512m}
    cpus: ${ANSWER_WORKER_CPUS:-1.0}

  postgres:
    # 保持 PostgreSQL 主版本 15，并固定 pgvector 扩展版本，避免 latest 漂移。
    # bookworm 镜像沿用 PostgreSQL 官方数据目录，可继续挂载现有 PG15 数据卷。
    image: pgvector/pgvector:0.8.2-pg15-bookworm
    container_name: rag_reasoning_postgres

    # PostgreSQL 官方镜像使用这三个变量初始化数据库。
    environment:
      POSTGRES_DB: ${DB_NAME:-rag_platform}
      POSTGRES_USER: ${DB_USER:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

    # 本机使用 5433，避免与已有的 5432 容器冲突。
    ports:
      - "${DB_PORT:-5433}:5432"

    # 删除容器后，数据仍保留在 Docker 数据卷中。
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

    # Docker 会定期检查 PostgreSQL 是否真正可以接受连接。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_user} -d ${DB_NAME:-rag_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # 为开发机限制内存和 CPU，防止数据库无限占用资源。
    mem_limit: 256m
    cpus: 1.0

    # 降低共享缓冲区和最大连接数，适合个人开发环境。
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20

  redis:
    # Redis 仅承担 Cache-Aside，不保存权限、任务或正式业务事实。
    image: redis:7-alpine
    container_name: rag_reasoning_redis

    # 缓存可以随时重建，因此关闭 RDB/AOF；allkeys-lfu 在达到内存上限时
    # 优先保留访问频率更高的查询，不影响 PostgreSQL 正式数据。
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lfu

    ports:
      # 避免与电脑上已有的 6379 Redis 冲突。
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    mem_limit: ${REDIS_CONTAINER_MEMORY_LIMIT:-160m}
    cpus: 0.5

  redis-coordination:
    # 只保存短期远程模型执行租约，不保存缓存和正式业务数据。
    image: redis:7-alpine
    container_name: rag_reasoning_redis_coordination

    # noeviction 是正确性边界：内存不足时申请失败并触发 503/异步重试，
    # 不能悄悄淘汰仍在执行的租约并放大 Provider 并发。
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${CAPACITY_REDIS_MAXMEMORY:-32mb}
      - --maxmemory-policy
      - noeviction

    ports:
      - "127.0.0.1:${CAPACITY_REDIS_HOST_PORT:-6381}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    mem_limit: ${CAPACITY_REDIS_CONTAINER_MEMORY_LIMIT:-64m}
    cpus: 0.25

  mailpit:
    # Mailpit 只在本地人工注册联调时启动；普通数据库和默认回归不依赖它。
    image: axllent/mailpit:v1.30.0
    container_name: rag_reasoning_mailpit
    profiles:
      - mailpit

    # SMTP 和 Web UI 都只绑定本机，不能公开暴露开发验证码收件箱。
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_HOST_PORT:-8025}:8025"

    # 官方镜像已经内置 /mailpit readyz 健康检查。
    mem_limit: 64m
    cpus: 0.25

volumes:
  rag_postgres_data:
