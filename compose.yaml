  PYTHON_SOURCE_ROOT: ai/src
  PYTHON_PDF_MAX_FILE_SIZE_BYTES: ${PYTHON_PDF_MAX_FILE_SIZE_BYTES:-52428800}
  PYTHON_PDF_MAX_PAGES: ${PYTHON_PDF_MAX_PAGES:-500}
  PYTHON_PROCESS_MODE: ${PYTHON_PROCESS_MODE:-oneshot}
  PYTHON_PROCESS_POOL_SIZE: ${PYTHON_PROCESS_POOL_SIZE:-2}
  PYTHON_PROCESS_MAX_DOCUMENTS: ${PYTHON_PROCESS_MAX_DOCUMENTS:-20}

