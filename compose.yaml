services:
  backend:
    # Go 服务与 Python 文档处理运行时打包在同一个镜像中。
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rag-reasoning-platform-backend:local
    container_name: rag_reasoning_backend

    # tini 负责转发停止信号并回收可能遗留的 Python 子进程。
    init: true
    stop_signal: SIGTERM

    # Go HTTP Shutdown 最多等待 10 秒，随后还要等待 Worker 和数据库清理。
    # 30 秒宽限期结束后 Docker 才会升级为 SIGKILL。
    stop_grace_period: 30s

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      APP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # 容器内必须使用 Compose 服务名和 PostgreSQL 容器端口，
      # 不能使用宿主机开发配置 localhost:5433。
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rag_platform}
      DB_USER: ${DB_USER:-rag_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}

      # Redis 只保存查询向量和问答结果的可丢弃副本。关闭缓存时业务链路
      # 完全绕过 Redis；开启后 Redis 故障也会自动回源远程模型。
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-false}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-rag}
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      CACHE_HMAC_SECRET: ${CACHE_HMAC_SECRET:-}
      CACHE_OPERATION_TIMEOUT: ${CACHE_OPERATION_TIMEOUT:-250ms}
      QUERY_VECTOR_CACHE_TTL: ${QUERY_VECTOR_CACHE_TTL:-12h}
      QUERY_VECTOR_CACHE_LOCK_TTL: ${QUERY_VECTOR_CACHE_LOCK_TTL:-30s}
      QUERY_VECTOR_CACHE_WAIT_TIMEOUT: ${QUERY_VECTOR_CACHE_WAIT_TIMEOUT:-2s}
      ANSWER_RESULT_CACHE_TTL: ${ANSWER_RESULT_CACHE_TTL:-15m}
      ANSWER_RESULT_CACHE_LOCK_TTL: ${ANSWER_RESULT_CACHE_LOCK_TTL:-90s}
      ANSWER_RESULT_CACHE_WAIT_TIMEOUT: ${ANSWER_RESULT_CACHE_WAIT_TIMEOUT:-10s}

      # P6 验证码接口默认使用零费用 Fake Sender，但 HMAC 密钥仍必须显式配置。
      VERIFICATION_HMAC_SECRET: ${VERIFICATION_HMAC_SECRET:-}
      VERIFICATION_SENDER: ${VERIFICATION_SENDER:-fake}

      # 容器内使用 Compose 服务名 mailpit；宿主机直接 go run 时使用
      # .env 中的 VERIFICATION_SMTP_HOST=127.0.0.1。
      VERIFICATION_SMTP_HOST: ${VERIFICATION_SMTP_COMPOSE_HOST:-mailpit}
      VERIFICATION_SMTP_PORT: 1025
      VERIFICATION_SMTP_FROM_ADDRESS: ${VERIFICATION_SMTP_FROM_ADDRESS:-no-reply@rag.local}
      VERIFICATION_SMTP_FROM_NAME: ${VERIFICATION_SMTP_FROM_NAME:-RAG Reasoning Platform}
      VERIFICATION_SMTP_TIMEOUT: ${VERIFICATION_SMTP_TIMEOUT:-5s}
      VERIFICATION_RATE_LIMIT_WINDOW: ${VERIFICATION_RATE_LIMIT_WINDOW:-1m}
      VERIFICATION_PER_CLIENT_LIMIT: ${VERIFICATION_PER_CLIENT_LIMIT:-5}
      VERIFICATION_GLOBAL_LIMIT: ${VERIFICATION_GLOBAL_LIMIT:-100}

      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
      AUTH_PER_CLIENT_LIMIT: ${AUTH_PER_CLIENT_LIMIT:-10}
      AUTH_GLOBAL_LIMIT: ${AUTH_GLOBAL_LIMIT:-200}

      APP_ROOT: /app
      STORAGE_ROOT: storage
      STORAGE_MAX_FILE_SIZE_BYTES: ${STORAGE_MAX_FILE_SIZE_BYTES:-209715200}
      UPLOAD_MAX_CONCURRENCY_PER_USER: ${UPLOAD_MAX_CONCURRENCY_PER_USER:-2}
      UPLOAD_MAX_CONCURRENCY_GLOBAL: ${UPLOAD_MAX_CONCURRENCY_GLOBAL:-16}
      UPLOAD_QUEUE_WAIT_TIMEOUT: ${UPLOAD_QUEUE_WAIT_TIMEOUT:-2s}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
      WORKER_PROCESSING_TIMEOUT: ${WORKER_PROCESSING_TIMEOUT:-5m}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-1}
      PROCESSING_MAX_ACTIVE_JOBS_PER_USER: ${PROCESSING_MAX_ACTIVE_JOBS_PER_USER:-5}
      PROCESSING_MAX_ACTIVE_JOBS_GLOBAL: ${PROCESSING_MAX_ACTIVE_JOBS_GLOBAL:-40}
      PROCESSING_MAX_IN_FLIGHT_PER_OWNER: ${PROCESSING_MAX_IN_FLIGHT_PER_OWNER:-1}
      PROCESSING_MAX_BORROWED_IN_FLIGHT_PER_OWNER: ${PROCESSING_MAX_BORROWED_IN_FLIGHT_PER_OWNER:-2}
      PROCESSING_STARVATION_THRESHOLD: ${PROCESSING_STARVATION_THRESHOLD:-2m}

      PYTHON_EXECUTABLE: python3
      PYTHON_SOURCE_ROOT: ai/src
      PYTHON_PDF_MAX_FILE_SIZE_BYTES: ${PYTHON_PDF_MAX_FILE_SIZE_BYTES:-52428800}
      PYTHON_PDF_MAX_PAGES: ${PYTHON_PDF_MAX_PAGES:-500}
      PYTHON_PROCESS_MODE: ${PYTHON_PROCESS_MODE:-oneshot}
      PYTHON_PROCESS_POOL_SIZE: ${PYTHON_PROCESS_POOL_SIZE:-2}
      PYTHON_PROCESS_MAX_DOCUMENTS: ${PYTHON_PROCESS_MAX_DOCUMENTS:-20}

      # 远程能力继续默认关闭。即使镜像能够运行 AI 链路，也不会在未授权时产生费用。
      EMBEDDING_WORKER_ENABLED: ${EMBEDDING_WORKER_ENABLED:-false}
      EMBEDDING_WORKER_CONCURRENCY: ${EMBEDDING_WORKER_CONCURRENCY:-1}
      EMBEDDING_MAX_ACTIVE_JOBS_PER_USER: ${EMBEDDING_MAX_ACTIVE_JOBS_PER_USER:-100}
      EMBEDDING_MAX_ACTIVE_JOBS_GLOBAL: ${EMBEDDING_MAX_ACTIVE_JOBS_GLOBAL:-500}
      EMBEDDING_MAX_IN_FLIGHT_PER_OWNER: ${EMBEDDING_MAX_IN_FLIGHT_PER_OWNER:-1}
      EMBEDDING_MAX_BORROWED_IN_FLIGHT_PER_OWNER: ${EMBEDDING_MAX_BORROWED_IN_FLIGHT_PER_OWNER:-2}
      EMBEDDING_STARVATION_THRESHOLD: ${EMBEDDING_STARVATION_THRESHOLD:-2m}
      EMBEDDING_PROVIDER_MAX_CONCURRENCY: ${EMBEDDING_PROVIDER_MAX_CONCURRENCY:-4}
      EMBEDDING_WORKER_PROVIDER_CONCURRENCY: ${EMBEDDING_WORKER_PROVIDER_CONCURRENCY:-2}
      EMBEDDING_ONLINE_PROVIDER_CONCURRENCY: ${EMBEDDING_ONLINE_PROVIDER_CONCURRENCY:-2}
      EMBEDDING_ONLINE_QUEUE_WAIT_TIMEOUT: ${EMBEDDING_ONLINE_QUEUE_WAIT_TIMEOUT:-2s}
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-false}
      ANSWER_ENABLED: ${ANSWER_ENABLED:-false}
      ANSWER_MAX_CONCURRENCY: ${ANSWER_MAX_CONCURRENCY:-10}
      ANSWER_MAX_CONCURRENCY_PER_USER: ${ANSWER_MAX_CONCURRENCY_PER_USER:-2}
      ANSWER_MAX_WAITERS_GLOBAL: ${ANSWER_MAX_WAITERS_GLOBAL:-500}
      ANSWER_MAX_WAITERS_PER_USER: ${ANSWER_MAX_WAITERS_PER_USER:-5}
      ANSWER_QUEUE_WAIT_TIMEOUT: ${ANSWER_QUEUE_WAIT_TIMEOUT:-5s}
      ANSWER_JOBS_ENABLED: ${ANSWER_JOBS_ENABLED:-false}
      ANSWER_JOB_WORKER_CONCURRENCY: ${ANSWER_JOB_WORKER_CONCURRENCY:-10}
      ANSWER_JOB_POLL_INTERVAL: ${ANSWER_JOB_POLL_INTERVAL:-1s}
      ANSWER_JOB_PROCESSING_TIMEOUT: ${ANSWER_JOB_PROCESSING_TIMEOUT:-90s}
      ANSWER_JOB_MAX_QUEUED_PER_USER: ${ANSWER_JOB_MAX_QUEUED_PER_USER:-5}
      ANSWER_JOB_MAX_QUEUED_GLOBAL: ${ANSWER_JOB_MAX_QUEUED_GLOBAL:-500}
      ANSWER_JOB_OWNER_IN_FLIGHT_LIMIT: ${ANSWER_JOB_OWNER_IN_FLIGHT_LIMIT:-1}
      ANSWER_JOB_OWNER_BORROWED_LIMIT: ${ANSWER_JOB_OWNER_BORROWED_LIMIT:-2}
      ANSWER_JOB_STARVATION_THRESHOLD: ${ANSWER_JOB_STARVATION_THRESHOLD:-30s}
      ANSWER_JOB_MAX_ATTEMPTS: ${ANSWER_JOB_MAX_ATTEMPTS:-3}
      ANSWER_JOB_RETRY_BASE_DELAY: ${ANSWER_JOB_RETRY_BASE_DELAY:-2s}
      ANSWER_JOB_RETRY_MAX_DELAY: ${ANSWER_JOB_RETRY_MAX_DELAY:-30s}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_EMBEDDING_ENDPOINT: ${DASHSCOPE_EMBEDDING_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
      DASHSCOPE_GENERATION_ENDPOINT: ${DASHSCOPE_GENERATION_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_ENDPOINT: ${OPENAI_EMBEDDING_ENDPOINT:-https://api.openai.com/v1/embeddings}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-}
      EMBEDDING_HTTP_TIMEOUT: ${EMBEDDING_HTTP_TIMEOUT:-30s}
      EMBEDDING_PROCESSING_TIMEOUT: ${EMBEDDING_PROCESSING_TIMEOUT:-5m}
      EMBEDDING_POLL_INTERVAL: ${EMBEDDING_POLL_INTERVAL:-2s}
      EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-5}
      EMBEDDING_RETRY_BASE_DELAY: ${EMBEDDING_RETRY_BASE_DELAY:-5s}
      EMBEDDING_RETRY_MAX_DELAY: ${EMBEDDING_RETRY_MAX_DELAY:-2m}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen3.6-flash}
      GENERATION_HTTP_TIMEOUT: ${GENERATION_HTTP_TIMEOUT:-60s}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-1024}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0.1}
      GENERATION_THINKING_ENABLED: ${GENERATION_THINKING_ENABLED:-false}

    ports:
      # 默认只暴露给当前电脑；如需局域网访问必须单独设计鉴权和网络边界。
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

    volumes:
      # 继续使用仓库中被 Git 忽略的 storage，容器重建不会删除上传文件。
      # 恢复演练后可以通过 STORAGE_HOST_PATH 无覆盖地切换到已验证的新目录。
      - ${STORAGE_HOST_PATH:-./storage}:/app/storage

    mem_limit: 768m
    cpus: ${BACKEND_CPUS:-2.0}

  postgres:
    # 保持 PostgreSQL 主版本 15，并固定 pgvector 扩展版本，避免 latest 漂移。
    # bookworm 镜像沿用 PostgreSQL 官方数据目录，可继续挂载现有 PG15 数据卷。
    image: pgvector/pgvector:0.8.2-pg15-bookworm
    container_name: rag_reasoning_postgres

    # PostgreSQL 官方镜像使用这三个变量初始化数据库。
    environment:
      POSTGRES_DB: ${DB_NAME:-rag_platform}
      POSTGRES_USER: ${DB_USER:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

    # 本机使用 5433，避免与已有的 5432 容器冲突。
    ports:
      - "${DB_PORT:-5433}:5432"

    # 删除容器后，数据仍保留在 Docker 数据卷中。
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

    # Docker 会定期检查 PostgreSQL 是否真正可以接受连接。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_user} -d ${DB_NAME:-rag_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # 为开发机限制内存和 CPU，防止数据库无限占用资源。
    mem_limit: 256m
    cpus: 1.0

    # 降低共享缓冲区和最大连接数，适合个人开发环境。
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20

  redis:
    # Redis 仅承担 Cache-Aside，不保存权限、任务或正式业务事实。
    image: redis:7-alpine
    container_name: rag_reasoning_redis

    # 缓存可以随时重建，因此关闭 RDB/AOF；allkeys-lfu 在达到内存上限时
    # 优先保留访问频率更高的查询，不影响 PostgreSQL 正式数据。
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lfu

    ports:
      # 避免与电脑上已有的 6379 Redis 冲突。
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    mem_limit: 160m
    cpus: 0.5

  mailpit:
    # Mailpit 只在本地人工注册联调时启动；普通数据库和默认回归不依赖它。
    image: axllent/mailpit:v1.30.0
    container_name: rag_reasoning_mailpit
    profiles:
      - mailpit

    # SMTP 和 Web UI 都只绑定本机，不能公开暴露开发验证码收件箱。
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_HOST_PORT:-8025}:8025"

    # 官方镜像已经内置 /mailpit readyz 健康检查。
    mem_limit: 64m
    cpus: 0.25

volumes:
  rag_postgres_data:
